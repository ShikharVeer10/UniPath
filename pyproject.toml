[project]
name = "UniPath"
version = "0.1.0"
description = "AI Admission Predictor Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1",
    "uvicorn>=0.34.0",
    "sqlmodel>=0.0.24",
    "asyncpg>=0.30.0",
    "alembic>=1.16.5",
    "pydantic[email]>=2.11.9",
    "pydantic-ai>=1.0.6",
    "pydantic-settings>=2.10.1",
    "passlib>=1.7.4",
    "bcrypt>=4.0.0,<4.1.0",
    "python-jose>=3.5.0",
    "pyjwt>=2.10.1",
    "openai>=1.0.0",
    "httpx>=0.28.0",
    "supabase>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "backend"]