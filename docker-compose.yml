services:
  api:
    image: python:3.12-slim
    container_name: unipath-api
    working_dir: /app
    volumes:
      - ./Backend:/app
    command: >
      sh -c "pip install --no-cache-dir uv &&
      uv pip install --system -r requirements.txt &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - ./Backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/unipath
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: unipath-db
    environment:
      POSTGRES_DB: unipath
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unipath"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
