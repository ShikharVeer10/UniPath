[project]
name = "unipath"
version = "0.1.0"
description = "AI-powered university admission predictor backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.4.0",
    "pydantic-ai>=0.0.14",
    "pgvector>=0.3.0",
    "pyjwt[crypto]>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "openai>=1.40.0",
    "pwdlib[bcrypt]>=0.3.1",
    "python-jose[cryptography]>=3.3.0",
    "pydantic[email]>=2.4.0",
    "slowapi>=0.1.9",
    "aiosqlite>=0.22.1",
    "pytest-asyncio>=1.4.0",
    "pypdf>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
